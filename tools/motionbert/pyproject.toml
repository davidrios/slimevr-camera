[project]
name = "motionbert-lift"
version = "0.1.0"
description = "Isolated env for MotionBERT 2D->3D lifting (exp 09, D36)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.4",
    "numpy>=1.26",
    "easydict>=1.13",
    "pyyaml>=6",
    "tqdm>=4",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
